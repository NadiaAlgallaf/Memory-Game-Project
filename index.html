<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script defer src="./js/app.js"></script>
    <link rel="stylesheet" href="./css/style.css" />
    <title>Memory Game</title>
  </head>
  <body>
    <header>
      <h1>Memory Game</h1>
      <h3 id="instruction">Match all pairs in 1 minute to win!</h3>
      <div id="data-section">
        <h2 id="Score">Score:0/8</h2>
        <h2 id="timer">Time:01:00</h2>
      </div>
    </header>
    <section id="grid-section">
      <div class="cards"></div>
      <div class="cards"></div>
      <div class="cards"></div>
      <div class="cards"></div>

      <div class="cards"></div>
      <div class="cards"></div>
      <div class="cards"></div>
      <div class="cards"></div>

      <div class="cards"></div>
      <div class="cards"></div>
      <div class="cards"></div>
      <div class="cards"></div>

      <div class="cards"></div>
      <div class="cards"></div>
      <div class="cards"></div>
      <div class="cards"></div>
    </section>
    <h2 id="message"></h2>
    <button id="reset">play Again</button>

    <div class="popup">
      <div class="popup-content">
        <h2 id="popup-title"></h2>
        <p id="popup-message"></p>
        <button id="reset">play Again</button>
      </div>
    </div>
  </body>
</html>
